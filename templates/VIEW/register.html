<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  <title>Registro</title>
</head>
<body>

  <div class="form-container">

    <h1>Crear Cuenta</h1>

    <!-- Flash messages -->
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="flash-messages">
          {% for m in messages %}
            <div class="flash">{{ m }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <!-- Registration Form -->
    <form class="form" action="{{ url_for('login_bp.register_submit') }}" method="post">

      <input class="input" type="text" name="name" placeholder="Nombre" required>
      <input class="input" type="text" name="lastname" placeholder="Apellido" required>

      <input class="input" type="email" name="email" placeholder="Correo electrónico" required>

      <input class="input" type="password" name="password" placeholder="Contraseña" required>

      <label class="label" for="role">Rol</label>
      <select class="input" name="role" id="role">
        <option value="3" selected>Cliente</option>
        <option value="2">Dueño de Restaurante</option>
        <option value="1">Administrador</option>
      </select>

      <button class="btn" type="submit">Registrarme</button>

    </form>

    <p class="form-footer">
      ¿Ya tienes una cuenta?
      <a class="link" href="{{ url_for('login_bp.login') }}">Inicia sesión aquí</a>
    </p>

  </div>

</body>
</html>

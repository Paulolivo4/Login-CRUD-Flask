<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  <title>Restablecer Contraseña</title>
</head>
<body>

  <div class="form-container">

    <h1>Restablecer Contraseña</h1>

    <!-- Flash messages -->
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="flash-messages">
          {% for m in messages %}
            <div class="flash">{{ m }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <!-- Reset Form -->
    <form class="form" action="{{ url_for('login_bp.reset_password_submit') }}" method="post">

      <input class="input" type="email" name="email" placeholder="Correo electrónico" required>

      <input class="input" type="password" name="new_password" placeholder="Nueva contraseña" required>

      <button class="btn" type="submit">Actualizar contraseña</button>

    </form>

    <p class="form-footer">
      ¿Recordaste tu contraseña?
      <a class="link" href="{{ url_for('login_bp.login') }}">Volver al inicio de sesión</a>
    </p>

  </div>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  <title>Panel de Cliente</title>
</head>
<body>

  <div class="dashboard-container">

    <div class="dashboard-header">
      <h1>Panel de Cliente</h1>

      {% if session.get('user_name') %}
        <p class="welcome">
          Hola, <strong>{{ session.get('user_name') }}</strong>  
          (<span>{{ session.get('user_email') }}</span>)
        </p>
      {% endif %}

      <a class="btn-logout" href="{{ url_for('login_bp.logout') }}">Cerrar sesión</a>
    </div>

    <div class="card">
      <h2>Reservas</h2>
      <p>Próximamente podrás ver y gestionar tus reservas aquí.</p>
      <p style="opacity: 0.7;">(Funcionalidad pendiente de implementación)</p>
    </div>

  </div>

</body>
</html>
